          "name": "How does the receipt scanner work?",
          "acceptedAnswer": { "@type": "Answer", "text": "Snap a photo of any receipt and Warraya reads the product, store, purchase date, and price for you. You glance, confirm, and save. The whole thing takes about thirty seconds." }

        {
          "@type": "Question",
          "name": "How does Warraya save me money?",
          "acceptedAnswer": { "@type": "Answer", "text": "A warranty is a refund you already paid for. Show the receipt, act before the deadline, and a repair or replacement that would cost real money is covered instead. Warraya keeps the proof and makes sure you never miss that window." }
        },
        {
          "@type": "Question",
          "name": "Is Warraya a warranty tracker or a receipt organizer?",

        },

          "@type": "Question",
          "name": "When will I hear about an expiring warranty?",
          "acceptedAnswer": { "@type": "Answer", "text": "Warraya sends you a notification 30 days before any of your warranties run out, and again 7 days before. That is plenty of time to test the product and file a claim if something is off." }
        },

          "name": "Is my information private?",
